<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asidum</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0f1115;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e6e8eb;
    font-family: system-ui, sans-serif;
  }

  svg {
    width: 240px;
    height: 240px;
    cursor: grab;
  }

  svg:active {
    cursor: grabbing;
  }
</style>
</head>
<body>

<svg viewBox="0 0 200 200">
  <defs>
    <!-- Inner sphere gradient -->
    <radialGradient id="innerGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7aa7ff"/>
      <stop offset="100%" stop-color="#2f5bd3"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Irregular outer boundary (circle with rupture) -->
  <path
    d="
      M100,18
      C140,18 170,45 178,78
      C182,96 168,98 158,96
      C172,118 160,152 128,172
      C100,188 60,178 38,148
      C20,124 18,94 30,70
      C42,46 62,18 100,18
      Z"
    fill="none"
    stroke="#e6e8eb"
    stroke-width="2"
    opacity="0.85"
  />

  <!-- Inner movable state -->
  <circle
    id="inner"
    cx="110"
    cy="90"
    r="10"
    fill="url(#innerGrad)"
    filter="url(#softShadow)"
  />
</svg>

<script>
const svg = document.querySelector("svg");
const inner = document.getElementById("inner");

let dragging = false;

svg.addEventListener("mousedown", e => {
  dragging = true;
});

window.addEventListener("mouseup", () => {
  dragging = false;
});

svg.addEventListener("mousemove", e => {
  if (!dragging) return;

  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;

  const cursor = pt.matrixTransform(svg.getScreenCTM().inverse());

  // Clamp movement (inner boundary)
  const centerX = 100;
  const centerY = 100;
  const maxDist = 42;

  let dx = cursor.x - centerX;
  let dy = cursor.y - centerY;

  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > maxDist) {
    dx *= maxDist / dist;
    dy *= maxDist / dist;
  }

  const x = centerX + dx;
  const y = centerY + dy;

  inner.setAttribute("cx", x);
  inner.setAttribute("cy", y);

  // 3D lighting illusion
  const lightX = 30 - dx;
  const lightY = 30 - dy;

  inner.setAttribute(
    "style",
    `filter: drop-shadow(${dx * 0.3}px ${dy * 0.5}px 8px rgba(0,0,0,0.45))`
  );
});
</script>

</body>
</html>
