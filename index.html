<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asidum</title>

<meta name="description" content="Defining a system state. Positive change happens within.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #141820;
  --fg: #eef1f5;
  --muted: #aab1bc;
  --accent: #8fb1ff;
  --logo: #16234a;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at 50% 30%, #1b2130, var(--bg));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}

.wrap {
  text-align: center;
}

.status {
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
}

svg {
  width: 320px;
  height: 320px;
  margin-bottom: 32px;
}

h1 {
  margin: 0 0 12px;
  font-size: 44px;
  font-weight: 600;
  letter-spacing: .06em;
}

.tagline {
  font-size: 16px;
  line-height: 1.7;
  color: var(--muted);
  margin-bottom: 22px;
}

.contact a {
  color: var(--fg);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,.3);
}

footer {
  margin-top: 30px;
  font-size: 13px;
  color: #7f8794;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="status">Under development</div>

  <svg viewBox="0 0 360 360" id="scene">
    <defs>
      <radialGradient id="ballGrad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#b8ccff"/>
        <stop offset="100%" stop-color="#5a7de0"/>
      </radialGradient>
    </defs>

    <!-- outer static C -->
    <path id="outer" fill="var(--logo)"/>

    <!-- inner deformable -->
    <path id="innerContour" fill="var(--bg)"/>

    <!-- ball -->
    <circle id="ball" r="12" fill="url(#ballGrad)"/>
  </svg>

  <h1>Asidum</h1>

  <div class="tagline">
    Defining a system state.<br>
    Positive change happens within.
  </div>

  <div class="contact">
    <a href="mailto:info@asidum.com">info@asidum.com</a>
  </div>

  <footer>© 2026 Asidum</footer>
</div>

<script>
const CENTER = { x:180, y:180 };
const R_OUT = 120;
const R_IN  = 78;
const GAP = Math.PI * 0.45;

const POINTS = 140;
const MAX_OFFSET = 58;

const outer = document.getElementById("outer");
const innerContour = document.getElementById("innerContour");
const ball = document.getElementById("ball");
const svg = document.getElementById("scene");

let ballPos = { ...CENTER };
let target = { ...CENTER };

svg.addEventListener("mousemove", e => {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const c = pt.matrixTransform(svg.getScreenCTM().inverse());

  let dx = c.x - CENTER.x;
  let dy = c.y - CENTER.y;
  const d = Math.hypot(dx, dy);

  if (d > MAX_OFFSET) {
    dx *= MAX_OFFSET / d;
    dy *= MAX_OFFSET / d;
  }

  target.x = CENTER.x + dx;
  target.y = CENTER.y + dy;
});

svg.addEventListener("mouseleave", () => {
  target.x = CENTER.x;
  target.y = CENTER.y;
});

function buildRing(r, deform=false) {
  let d = "";
  for (let i=0;i<=POINTS;i++) {
    const a = GAP/2 + (Math.PI*2-GAP)*(i/POINTS);
    let rr = r;

    if (deform) {
      const dx = Math.cos(a)*r + CENTER.x - ballPos.x;
      const dy = Math.sin(a)*r + CENTER.y - ballPos.y;
      const dist = Math.hypot(dx,dy);
      rr += Math.exp(-dist*0.05)*22;
    }

    const x = CENTER.x + Math.cos(a)*rr;
    const y = CENTER.y + Math.sin(a)*rr;
    d += (i===0?"M":"L")+x+","+y;
  }
  return d;
}

function update() {
  ballPos.x += (target.x - ballPos.x)*0.12;
  ballPos.y += (target.y - ballPos.y)*0.12;

  ball.setAttribute("cx", ballPos.x);
  ball.setAttribute("cy", ballPos.y);

  outer.setAttribute("d",
    buildRing(R_OUT,false) +
    "L"+buildRing(R_IN,false).split("M")[1]+"Z"
  );

  innerContour.setAttribute("d",
    buildRing(R_IN,true)+"Z"
  );

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
