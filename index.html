<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asidum</title>

<meta name="description" content="Defining a system state where systems remain stable and positive change happens within.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0f1115;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e6e8eb;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap {
    text-align: center;
  }

  svg {
    width: 260px;
    height: 260px;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .tagline {
    font-size: 15px;
    line-height: 1.6;
    color: #9aa0a6;
    max-width: 520px;
    margin: 0 auto 18px;
  }

  .contact a {
    color: #e6e8eb;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.35);
  }

  .contact a:hover {
    color: #7aa7ff;
    border-color: #7aa7ff;
  }

  footer {
    margin-top: 28px;
    font-size: 13px;
    color: #6b7280;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- INTERACTIVE LOGO -->
  <svg viewBox="0 0 200 200">
    <defs>
      <radialGradient id="innerGrad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#7aa7ff"/>
        <stop offset="100%" stop-color="#2f5bd3"/>
      </radialGradient>
    </defs>

    <path id="boundary"
          fill="none"
          stroke="#e6e8eb"
          stroke-width="2"
          opacity="0.85"/>

    <circle id="inner"
            r="10"
            fill="url(#innerGrad)"/>
  </svg>

  <h1>Asidum</h1>

  <div class="tagline">
    Defining a system state.<br>
    Where systems remain stable and positive change happens within.
  </div>

  <div class="contact">
    <a href="mailto:info@asidum.com">info@asidum.com</a>
  </div>

  <footer>
    © 2026 Asidum
  </footer>

</div>

<script>
const svg = document.querySelector("svg");
const boundary = document.getElementById("boundary");
const inner = document.getElementById("inner");

const CENTER = { x: 100, y: 100 };
const BASE_RADIUS = 72;
const POINTS = 40;
const MAX_OFFSET = 34;
const DEFORM_STRENGTH = 0.9;

let shape = Array.from({ length: POINTS }, (_, i) => {
  const a = (Math.PI * 2 * i) / POINTS;
  return { angle: a, base: BASE_RADIUS, current: BASE_RADIUS };
});

let innerPos = { x: CENTER.x, y: CENTER.y };
let targetInner = { ...innerPos };
let mouseActive = false;

svg.addEventListener("mousemove", e => {
  mouseActive = true;

  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const c = pt.matrixTransform(svg.getScreenCTM().inverse());

  let dx = c.x - CENTER.x;
  let dy = c.y - CENTER.y;
  const d = Math.hypot(dx, dy);

  if (d > MAX_OFFSET) {
    dx *= MAX_OFFSET / d;
    dy *= MAX_OFFSET / d;
  }

  targetInner.x = CENTER.x + dx;
  targetInner.y = CENTER.y + dy;
});

svg.addEventListener("mouseleave", () => {
  mouseActive = false;
});

function update() {
  // inner sphere follows cursor, but never snaps back
  innerPos.x += (targetInner.x - innerPos.x) * 0.08;
  innerPos.y += (targetInner.y - innerPos.y) * 0.08;

  inner.setAttribute("cx", innerPos.x);
  inner.setAttribute("cy", innerPos.y);

  const vx = innerPos.x - CENTER.x;
  const vy = innerPos.y - CENTER.y;
  const vAngle = Math.atan2(vy, vx);
  const vDist = Math.hypot(vx, vy) / MAX_OFFSET;

  shape.forEach(p => {
    let influence = 0;

    if (mouseActive) {
      const da = Math.atan2(
        Math.sin(p.angle - vAngle),
        Math.cos(p.angle - vAngle)
      );
      influence = Math.exp(-da * da * 2.2) * vDist;
    }

    const targetRadius = p.base + influence * BASE_RADIUS * DEFORM_STRENGTH;
    p.current += (targetRadius - p.current) * 0.15;
  });

  let d = "";
  shape.forEach((p, i) => {
    const x = CENTER.x + Math.cos(p.angle) * p.current;
    const y = CENTER.y + Math.sin(p.angle) * p.current;
    d += (i === 0 ? "M" : "L") + x + "," + y;
  });
  d += "Z";

  boundary.setAttribute("d", d);

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
