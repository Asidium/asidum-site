<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asidum</title>

  <meta name="description" content="Asidum — product in development">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #0f1115;
      --fg: #e6e8eb;
      --muted: #9aa0a6;
      --accent: #4f8cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 520px;
      padding: 48px 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 48px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 24px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
    }

    .status {
      display: inline-block;
      margin-bottom: 32px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--accent);
      border: 1px solid rgba(79, 140, 255, 0.4);
    }

    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      transition: border-color 0.2s, color 0.2s;
    }

    a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="container">
    <span class="status">Product in development</span>

    <h1>Asidum</h1>

    <p>
      We are working on a new product.<br>
      More details coming soon.
    </p>

    <p>
      Contact: <a href="mailto:info@asidum.com">info@asidum.com</a>
    </p>

    <footer>
      © 2026 Asidum
    </footer>
  </main>
</body>
</html>
