<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asidum</title>

<meta name="description" content="Defining a system state. Positive change happens within.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg: #141820;
    --fg: #eef1f5;
    --muted: #aab1bc;
    --stroke: #cfd5df;
    --accent: #8fb1ff;
    --ink: #1a2b57;
  }

  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1b2130, var(--bg));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap {
    text-align: center;
  }

  .status {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }

  svg {
    width: 340px;
    height: 340px;
    margin-bottom: 34px;
    overflow: visible;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .tagline {
    font-size: 16px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .contact a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.3);
  }

  .contact a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  footer {
    margin-top: 30px;
    font-size: 13px;
    color: #7f8794;
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="status">Under development</div>

  <!-- INTERACTIVE LOGO -->
  <svg viewBox="0 0 360 360">
    <defs>
      <radialGradient id="innerGrad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#b8ccff"/>
        <stop offset="100%" stop-color="#5a7de0"/>
      </radialGradient>
    </defs>

    <!-- ВНЕШНИЙ КРУГ -->
    <circle cx="180" cy="180" r="140"
            fill="none"
            stroke="var(--ink)"
            stroke-width="34"/>

    <!-- ВНУТРЕННЯЯ ФОРМА (деформируемая) -->
    <path id="innerShape" fill="var(--ink)"/>

    <!-- ШАР -->
    <circle id="ball" r="11" fill="url(#innerGrad)"/>
  </svg>

  <h1>Asidum</h1>

  <div class="tagline">
    Defining a system state.<br>
    Positive change happens within.
  </div>

  <div class="contact">
    <a href="mailto:info@asidum.com">info@asidum.com</a>
  </div>

  <footer>© 2026 Asidum</footer>

</div>

<script>
const svg = document.querySelector("svg");
const shapePath = document.getElementById("innerShape");
const ball = document.getElementById("ball");

const CENTER = { x: 180, y: 180 };
const BASE_RADIUS = 82;
const POINTS = 120;
const MAX_OFFSET = 58;

let mouseActive = false;
let targetBall = { ...CENTER };
let ballPos = { ...CENTER };

const shape = Array.from({ length: POINTS }, (_, i) => {
  const angle = (Math.PI * 2 * i) / POINTS;
  return { angle, base: BASE_RADIUS, current: BASE_RADIUS };
});

svg.addEventListener("mousemove", e => {
  mouseActive = true;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const c = pt.matrixTransform(svg.getScreenCTM().inverse());

  let dx = c.x - CENTER.x;
  let dy = c.y - CENTER.y;
  const d = Math.hypot(dx, dy);

  if (d > MAX_OFFSET) {
    dx *= MAX_OFFSET / d;
    dy *= MAX_OFFSET / d;
  }

  targetBall.x = CENTER.x + dx;
  targetBall.y = CENTER.y + dy;
});

svg.addEventListener("mouseleave", () => {
  mouseActive = false;
  targetBall.x = CENTER.x;
  targetBall.y = CENTER.y;
});

function update() {
  // движение шара
  ballPos.x += (targetBall.x - ballPos.x) * 0.09;
  ballPos.y += (targetBall.y - ballPos.y) * 0.09;

  ball.setAttribute("cx", ballPos.x);
  ball.setAttribute("cy", ballPos.y);

  // деформация внутреннего контура
  shape.forEach(p => {
    const px = CENTER.x + Math.cos(p.angle) * p.current;
    const py = CENTER.y + Math.sin(p.angle) * p.current;

    const dx = px - ballPos.x;
    const dy = py - ballPos.y;
    const dist = Math.hypot(dx, dy);

    let influence = 0;
    if (mouseActive) {
      influence = Math.exp(-(dist * dist) / (2 * 800));
    }

    const targetR =
      p.base + influence * 46;

    p.current += (targetR - p.current) * 0.13;
  });

  // построение пути
  let d = "";
  shape.forEach((p, i) => {
    const x = CENTER.x + Math.cos(p.angle) * p.current;
    const y = CENTER.y + Math.sin(p.angle) * p.current;
    d += (i === 0 ? "M" : "L") + x + "," + y;
  });
  d += "Z";

  shapePath.setAttribute("d", d);

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
