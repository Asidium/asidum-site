<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asidum</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="Logo1.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">


<meta name="description" content=" Just explore, explore simple.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg: #141820;
    --fg: #eef1f5;
    --muted: #aab1bc;
    --accent: #8fb1ff;
  }

  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1b2130, var(--bg));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap {
    text-align: center;
  }

  .status {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .logo {
    width: 280px;
    height: auto;
    margin-bottom: 36px;
    display: block;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .tagline {
    font-size: 16px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .contact a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.3);
  }

  .contact a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  footer {
    margin-top: 30px;
    font-size: 13px;
    color: #7f8794;
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="status">Under development</div>

  <!-- LOGO -->
  <img
    src="/Logo1.svg"
    alt="Asidum logo"
    class="logo"
    draggable="false"
  />

  <h1>Asidum</h1>

  <div class="tagline">
    Defining a system state.<br>
    Positive change happens within.
  </div>

  <div class="contact">
    <a href="mailto:info@asidum.com">info@asidum.com</a>
  </div>

  <footer>
    © 2026 Asidum
  </footer>

</div>

</body>
</html>
