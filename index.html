<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asidum</title>

<meta name="description" content="Defining a system state. Positive change happens within.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg: #141820;
    --fg: #eef1f5;
    --muted: #aab1bc;
    --stroke: #cfd5df;
    --accent: #8fb1ff;
  }

  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1b2130, var(--bg));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap {
    text-align: center;
  }

  .status {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }

  svg {
    width: 320px;
    height: 320px;
    margin-bottom: 32px;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .tagline {
    font-size: 16px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .contact a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.3);
  }

  .contact a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  footer {
    margin-top: 30px;
    font-size: 13px;
    color: #7f8794;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="status">Under development</div>

  <!-- INTERACTIVE LOGO -->
  <svg viewBox="0 0 320 320">
    <defs>
      <radialGradient id="innerGrad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#b8ccff"/>
        <stop offset="100%" stop-color="#5a7de0"/>
      </radialGradient>
    </defs>

    <path id="boundary"
          fill="none"
          stroke="var(--stroke)"
          stroke-width="2"
          opacity="0.9"/>

    <circle id="inner"
            r="11"
            fill="url(#innerGrad)"/>
  </svg>

  <h1>Asidum</h1>

  <div class="tagline">
    Defining a system state.<br>
    Positive change happens within.
  </div>

  <div class="contact">
    <a href="mailto:info@asidum.com">info@asidum.com</a>
  </div>

  <footer>
    © 2026 Asidum
  </footer>

</div>

<script>
const svg = document.querySelector("svg");
const boundary = document.getElementById("boundary");
const inner = document.getElementById("inner");

const CENTER = { x: 160, y: 160 };
const BASE_RADIUS = 90;
const POINTS = 48;
const MAX_OFFSET = 52;
const DEFORM_STRENGTH = 1.35;

let shape = Array.from({ length: POINTS }, (_, i) => {
  const a = (Math.PI * 2 * i) / POINTS;
  return { angle: a, base: BASE_RADIUS, current: BASE_RADIUS };
});

let innerPos = { ...CENTER };
let targetInner = { ...CENTER };
let mouseActive = false;

svg.addEventListener("mousemove", e => {
  mouseActive = true;

  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const c = pt.matrixTransform(svg.getScreenCTM().inverse());

  let dx = c.x - CENTER.x;
  let dy = c.y - CENTER.y;
  const d = Math.hypot(dx, dy);

  if (d > MAX_OFFSET) {
    dx *= MAX_OFFSET / d;
    dy *= MAX_OFFSET / d;
  }

  targetInner.x = CENTER.x + dx;
  targetInner.y = CENTER.y + dy;
});

svg.addEventListener("mouseleave", () => {
  mouseActive = false;
});

function update() {
  innerPos.x += (targetInner.x - innerPos.x) * 0.08;
  innerPos.y += (targetInner.y - innerPos.y) * 0.08;

  inner.setAttribute("cx", innerPos.x);
  inner.setAttribute("cy", innerPos.y);

  const vx = innerPos.x - CENTER.x;
  const vy = innerPos.y - CENTER.y;
  const vAngle = Math.atan2(vy, vx);
  const vDist = Math.hypot(vx, vy) / MAX_OFFSET;

  shape.forEach(p => {
    let influence = 0;
    if (mouseActive) {
      const da = Math.atan2(
        Math.sin(p.angle - vAngle),
        Math.cos(p.angle - vAngle)
      );
      influence = Math.exp(-da * da * 1.6) * vDist;
    }

    const targetR = p.base + influence * BASE_RADIUS * DEFORM_STRENGTH;
    p.current += (targetR - p.current) * 0.14;
  });

  let d = "";
  shape.forEach((p, i) => {
    const x = CENTER.x + Math.cos(p.angle) * p.current;
    const y = CENTER.y + Math.sin(p.angle) * p.current;
    d += (i === 0 ? "M" : "L") + x + "," + y;
  });
  d += "Z";

  boundary.setAttribute("d", d);
  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
